<!-- LOGO ELATRANSFER : la version « maskable » d'Android.
     LE FOND EST UN CARRÉ PLEIN, ET C'EST OBLIGATOIRE : Android recadre
     lui-même l'icône dans la forme de son lanceur et rogne jusqu'à 10 %
     de chaque bord. Une icône maskable à coins transparents donnerait un
     rond posé sur un carré blanc. Tout le dessin tient donc dans la zone
     sûre — un cercle de 80 % du côté — et le filet ne sort pas du cadre,
     contrairement à icon.svg.
     Fabriqué par composer.py, ne pas retoucher à la main.
     Attention : un commentaire XML ne supporte pas deux tirets à la
     suite. -->
