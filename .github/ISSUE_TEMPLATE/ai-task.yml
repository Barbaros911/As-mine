name: Tâche agent IA
description: Tâche bornée pour Claude, ChatGPT ou l'agent local ELA
title: "[TEAM] "
labels: []
body:
  # LA PRIORITÉ EST L'ÉTIQUETTE P0…P3, PAS UN CHAMP DU FORMULAIRE
  # (TEAM_RULES.md §11). Un menu ici écrivait la priorité dans le texte de
  # l'Issue, où rien ne peut la compter : /etat et ChatGPT lisent les
  # étiquettes, et deux sources finissent toujours par se contredire.
  - type: markdown
    attributes:
      value: >-
        **Priorité** : poser l'étiquette `P0`, `P1`, `P2` ou `P3` sur cette
        Issue (TEAM_RULES.md §11). Trois priorités actives au plus ; P3 =
        parking.
  - type: dropdown
    id: status
    attributes:
      label: Statut initial
      options: [Backlog, À faire, En cours, À tester, À valider, Terminé]
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Responsable / agent
      placeholder: Claude Code, ChatGPT, Agent local ELA ou humain nommé
    validations:
      required: true
  - type: input
    id: branch
    attributes:
      label: Branche et worktree
      placeholder: ai/123-agent-sujet — chemin du worktree
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description et fichiers concernés
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critères d'acceptation
      placeholder: "- [ ] Critère vérifiable"
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Tests nécessaires
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dépendances, blocages et liens PR
