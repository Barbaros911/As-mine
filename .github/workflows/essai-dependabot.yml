name: Essai des mises à jour Dependabot (temporaire)

# Rejoue la chaîne de « Publier le site » avec checkout@v7, setup-node@v7 et
# configure-pages@v6, SANS la dernière étape (deploy-pages). Ne se lance que
# sur la branche d'essai : il ne peut rien mettre en ligne. À supprimer une
# fois les mises à jour validées.

on:
  push:
    branches: [claude/dependabot-updates-d2oewz]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  chaine-de-publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/configure-pages@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: node test-doc.mjs
      - run: node test-unified-facade.mjs

      - name: Le site construit existe
        run: test -s site/index.html && ls site | head -20

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
