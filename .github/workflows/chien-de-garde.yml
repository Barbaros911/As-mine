# =====================================================================
# LE CHIEN DE GARDE — « est-ce que je reçois bien tout ? », toutes les 15 min
# ---------------------------------------------------------------------
# 2 octobre 2026, à la demande de Barbaros. « Monitoring production » vérifie
# que le SITE répond ; celui-ci vérifie que les DEMANDES arrivent jusqu'à
# lui : aucune demande du site sans alerte réussie, la relance pg_cron qui
# tourne, Telegram qui accepte les envois.
#
# IL LIT, IL N'ÉCRIT JAMAIS DANS LA BASE. Une seule requête, en lecture
# seule (.github/scripts/sante-serveur.sql), qui ne sort que des comptes et
# des secondes — jamais un nom, un téléphone ou une adresse : le journal
# est public.
#
# IL N'ALERTE QU'EN CAS DE PANNE, et jamais sur Telegram (Barbaros n'en veut
# pas davantage) : une Issue unique, retrouvée par son marqueur, mise à jour
# tant que ça dure, fermée d'elle-même au retour à la normale. GitHub lui
# envoie l'e-mail de l'Issue. Même mécanique que monitoring-production.
#
# Même jeton que les migrations (SUPABASE_ACCESS_TOKEN), même adresse de
# l'API de gestion. Le juge est à part (chien-de-garde.mjs) pour être éprouvé
# sans réseau par test-chien-de-garde.mjs.
# =====================================================================
name: Chien de garde des alertes

on:
  schedule:
    # LE PREMIER PASSAGE PLANIFIÉ EST ARRIVÉ 4 H APRÈS LA FUSION (2 octobre
    # 2026, fusion à 18 h 05, premier passage seul à 22 h 08) : GitHub met
    # parfois des heures à enregistrer un planning neuf, et un passage sur
    # quatre a manqué dans l'heure qui a suivi. Ne pas lire ce silence comme
    # une expression fautive — elle a été éprouvée. Et ne pas retoucher ce
    # fichier sans raison : chaque modification peut réenclencher ce délai.
    - cron: "7-59/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ela-chien-de-garde
  cancel-in-progress: false

jobs:
  garder:
    name: les demandes arrivent-elles jusqu'à Barbaros
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Le jeton vit dans l'environnement « production », restreint à main
    # (2 octobre 2026, même règle que fonctions.yml et migrations.yml). Un
    # planning tourne toujours sur main ; seul un lancement manuel depuis
    # une autre branche est concerné, et il est refusé à voix haute.
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJET: yyhzutnuhuytokarynaw
    steps:
      - name: Refuser toute branche autre que main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Le chien de garde ne lit la production que depuis main. Branche reçue : $GITHUB_REF"
            exit 1
          fi

      - uses: actions/checkout@v7.0.1

      - name: Utiliser Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Lire l'état du serveur et juger
        id: juge
        shell: bash
        run: |
          set +e
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Le secret SUPABASE_ACCESS_TOKEN n'est pas posé : le chien de garde ne peut rien lire." > "$RUNNER_TEMP/verdict.txt"
            echo "etat=panne" >> "$GITHUB_OUTPUT"; cat "$RUNNER_TEMP/verdict.txt"; exit 0
          fi
          # Le MÊME appel que le workflow des migrations, éprouvé en production :
          # on ne devine pas un paramètre d'API qu'on ne peut pas vérifier d'ici.
          corps=$(jq -Rs '{query: .}' < .github/scripts/sante-serveur.sql)
          code=$(curl -sS -o "$RUNNER_TEMP/sante.json" -w '%{http_code}' \
            -X POST "https://api.supabase.com/v1/projects/$PROJET/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$corps")
          echo "Lecture de l'état : HTTP $code"
          if [ "$code" != "201" ] && [ "$code" != "200" ]; then
            echo "Le serveur n'a pas répondu à la lecture d'état (HTTP $code)." > "$RUNNER_TEMP/verdict.txt"
            cat "$RUNNER_TEMP/sante.json"; echo
            echo "etat=panne" >> "$GITHUB_OUTPUT"; cat "$RUNNER_TEMP/verdict.txt"; exit 0
          fi
          node .github/scripts/chien-de-garde.mjs "$(cat "$RUNNER_TEMP/sante.json")" > "$RUNNER_TEMP/verdict.txt" 2>&1
          if [ $? -eq 0 ]; then echo "etat=ok" >> "$GITHUB_OUTPUT"; else echo "etat=panne" >> "$GITHUB_OUTPUT"; fi
          cat "$RUNNER_TEMP/verdict.txt"
          { echo "## Chien de garde des alertes"; echo; echo '```'; cat "$RUNNER_TEMP/verdict.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Ouvrir ou clore l'incident
        if: always()
        uses: actions/github-script@v8
        env:
          ETAT: ${{ steps.juge.outputs.etat }}
        with:
          script: |
            const fs = require("fs");
            const owner = context.repo.owner, repo = context.repo.repo;
            const marqueur = "<!-- ela-chien-de-garde -->";
            const titre = "[ALERTES] Des demandes risquent de ne pas arriver jusqu'à Barbaros";
            const etat = process.env.ETAT || "panne";
            let verdict = "";
            try { verdict = fs.readFileSync(`${process.env.RUNNER_TEMP}/verdict.txt`, "utf8"); } catch { verdict = "(verdict indisponible)"; }
            const ouvertes = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: "open", per_page: 100 });
            const incident = ouvertes.find(i => !i.pull_request && i.body && i.body.includes(marqueur));
            const lien = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const pied = ["", "---", "_Generated by [Claude Code](https://claude.ai/code)_"].join("\n");
            if (etat === "ok") {
              if (incident) {
                await github.rest.issues.createComment({ owner, repo, issue_number: incident.number,
                  body: ["## Retour à la normale", "", "Les demandes arrivent de nouveau jusqu'à Barbaros.", "", `Passage : ${lien}`, "", "```", verdict.trim(), "```", pied].join("\n") });
                await github.rest.issues.update({ owner, repo, issue_number: incident.number, state: "closed", state_reason: "completed" });
                core.notice(`Incident #${incident.number} clos.`);
              } else core.notice("Tout arrive. Rien à signaler.");
              return;
            }
            const corps = [marqueur, "## P0 — la chaîne des alertes a un problème", "",
              `Détecté : ${new Date().toISOString()}`, `Passage : ${lien}`, "",
              "@Barbaros911 — ce contrôle tourne toutes les 15 minutes et n'écrit que quand quelque chose cloche.", "",
              "### Ce qui cloche", "", "```", verdict.trim(), "```", "",
              "### Que faire", "",
              "- « demande(s) sans alerte » → ouvrir l'admin : la demande y est, elle n'a simplement pas sonné. Puis vérifier Telegram et les notifications dans Réglages → « Tester mes alertes ».",
              "- « relance absente ou inactive » → relancer le workflow « Appliquer une migration Supabase » avec `20260930000000_relance_alertes.sql`.",
              "- « Telegram refuse » → le jeton du bot ou la conversation a changé : vérifier TELEGRAM_TOKEN et TELEGRAM_CHAT dans les secrets Supabase.",
              "", "Cette Issue se ferme d'elle-même dès qu'un contrôle repasse au vert.", pied].join("\n");
            if (incident) {
              await github.rest.issues.update({ owner, repo, issue_number: incident.number, body: corps });
              core.setFailed(`Toujours en panne — incident #${incident.number} mis à jour.`);
            } else {
              /* L'ISSUE EST ASSIGNÉE À BARBAROS (audit du 9 octobre 2026). Une Issue
                 créée par le robot ne notifie personne : seuls ceux qui y
                 « participent » reçoivent les mises à jour. Assigné, il reçoit
                 l'ouverture et chaque mise à jour — dès que l'application GitHub
                 de son iPhone a ses notifications activées. Un chien de garde
                 qui aboie dans une pièce vide ne garde rien. */
              const cree = await github.rest.issues.create({ owner, repo, title: titre, body: corps, assignees: [owner] });
              core.setFailed(`Panne détectée — incident #${cree.data.number} ouvert.`);
            }
