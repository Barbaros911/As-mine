name: ELA Tracking Sync

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  sync-linked-issues:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Synchroniser les Issues liées
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;

            if (!pr) {
              core.notice("Exécution manuelle : aucune PR à synchroniser.");
              return;
            }

            const text = [pr.title || "", pr.body || ""].join("\n");
            const issueNumbers = new Set();

            // Références explicites #123 + syntaxes GitHub closes/fixes/resolves.
            for (const m of text.matchAll(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)?\s*#(\d+)/gi)) {
              issueNumbers.add(Number(m[1]));
            }

            // Une PR peut mentionner d'autres PR : ne fermer que de vraies Issues.
            for (const number of issueNumbers) {
              if (number === pr.number) continue;

              let issue;
              try {
                issue = (await github.rest.issues.get({ owner, repo, issue_number: number })).data;
              } catch (error) {
                core.warning(`#${number}: lecture impossible (${error.message})`);
                continue;
              }
              if (issue.pull_request) continue;

              const marker = "<!-- ela-tracking-sync -->";
              const body = [
                marker,
                "## Synchronisation automatique ELA",
                "",
                `La PR #${pr.number} **${pr.title}** a été fusionnée dans \`main\`.`,
                "",
                `Commit de fusion : \`${pr.merge_commit_sha || "non disponible"}\`.`,
                "",
                "État automatique : **FUSIONNÉ**.",
                "",
                "Cette automatisation ne déclare pas **TERMINÉ** et ne ferme pas l’Issue :",
                "les étapes DÉPLOYÉ / VÉRIFIÉ EN PRODUCTION et la validation humaine restent obligatoires lorsqu’elles s’appliquent."
              ].join("\n");

              const comments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number: number, per_page: 100 }
              );
              const previous = comments.find(c => c.body && c.body.includes(marker) && c.user?.type === "Bot");

              if (previous) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: previous.id, body
                });
              } else {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: number, body
                });
              }
            }
