name: Contrôle de l'admin retenu
# L'ADMIN QUE BARBAROS UTILISE N'AVAIT AUCUNE SUITE EN CI (audit du 3 octobre
# 2026, P1-15). Sept des neuf suites lancées par GitHub visaient Admin v2 --
# l'espace qu'il n'utilise pas, retiré de la publication depuis. Celles de
# l'admin retenu (le tableau de bord, la clôture, la synchronisation, le mode
# sans réseau) ne tournaient qu'à la main, donc pas du tout le jour où l'on
# oublie : une régression partait en ligne sans que rien ne tombe.
# SUR TOUTES LES PULL REQUESTS, SANS FILTRE DE CHEMINS (audit du 9 octobre
# 2026). Ce contrôle est celui qui doit INTERDIRE la fusion quand une suite
# est rouge — or GitHub ne peut exiger qu'un contrôle qui tourne à chaque
# PR : filtré par chemins, il n'est pas lancé sur une PR qui ne touche pas
# ses motifs, et une exigence « admin » bloquerait alors la fusion pour
# toujours (« Expected — waiting for status »). Il y avait ici une liste de
# motifs, plus longue à chaque bloc ; elle tombait de toute façon dès qu'un
# fichier était oublié. Le prix : 20 à 25 minutes par PR, y compris une PR
# de documentation. Pour une publication qui engage un prix ferme, c'est le
# bon prix.
on:
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
# UN SEUL PASSAGE PAR PR (1er novembre 2026). Une nouvelle poussée annule le
# passage du commit précédent, dont le verdict ne compte plus : le 31/10, les
# passages 205 et 206 de la même PR ont tourné ensemble pendant 11 minutes.
# Seul le passage du dernier commit compte pour la règle de main.
concurrency:
  group: admin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  admin:
    runs-on: ubuntu-latest
    # 75 MINUTES (31/10/2026). Mesuré sur les trois dernières PR : 42 min 14,
    # 42 min 25, 42 min 58 pour un plafond de 45 — deux minutes de marge, un
    # GitHub un peu lent et le contrôle exigé tombait sans qu'aucune suite
    # soit rouge. Les quinze suites ajoutées ce jour-là allongent encore.
    # Un plafond atteint n'est pas un échec de suite : relire la durée avant
    # de chercher un défaut.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with: {node-version: '22'}
      # La MÊME version que la machine de travail : une autre version de
      # Playwright n'ordonne pas les routes de la même façon, et une suite
      # verte ici est tombée là-bas pour cette seule raison (septembre 2026).
      - name: Navigateur
        run: |
          # Avec Playwright, deux tiers qui jugent à notre place, jamais dans
          # le dépôt : jsQR décode l'affiche QR, http_ece déchiffre une
          # notification. Absents, leurs suites ÉCHOUENT au lieu de sauter le
          # contrôle. Une seule installation : une seconde « --no-save »
          # retirerait ce que la première a posé hors de package.json.
          npm install --no-save playwright@1.56.1 jsqr@1.4.0 http_ece@1.2.1
          npx playwright install --with-deps chromium
      - name: Suites de l'admin retenu
        shell: bash
        run: |
          set -uo pipefail
          # Quatre suites éprouvent l'espace exploitant dans le DÉPÔT, servi tel
          # quel sur le port 8099 ; les autres construisent et servent le site
          # elles-mêmes.
          npx --yes http-server . -s -p 8099 >/tmp/serveur.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8099/ && break; sleep 1; done
          # LA RÈGLE, PAS LA LISTE : toute suite « test-admin-* » tourne ici,
          # y compris celles qui construisent aussi Admin v2 (1er novembre
          # 2026). Elles étaient sautées et ne tournaient que dans « Contrôle
          # Admin v2 », filtré par chemins sans index.html : la commission de
          # l'admin retenu (test-admin-commission) n'était éprouvée sur aucune
          # PR qui ne touchait qu'au site. Chacune construit elle-même la
          # variante qu'elle demande.
          suites=""
          for f in test-admin-*.mjs; do suites="$suites ${f%.mjs}"; done
          # test-nouveau-bascule éprouve ce qui part EN LIGNE : c'est elle qui
          # vérifie qu'aucune page de l'admin ni de la réception ne publie ses
          # notes de travail. Hors CI, l'oubli d'une ligne dans construire.sh
          # passait sans bruit (relecture de la PR #306, 4 octobre 2026).
          # test-cloisonnement-hotel prouve que les quatre espaces restent
          # séparés SUR LE SITE CONSTRUIT : aucun code ni écran Admin chez le
          # Public et le Client, la Réception limitée à son hôtel, les anciens
          # liens réduits à des redirections. Elle ne tournait qu'à la main —
          # c'est ainsi que « telValide » est parti en ligne le 29 septembre
          # (audit du cloisonnement, 4 octobre 2026).
          # LA RÉCEPTION D'easyHotel (5 octobre 2026) : ses trois suites ne
          # tournaient qu'à la main, alors que l'hôtel s'en sert dès le 12.
          # Toute suite « test-reception-* » est prise d'office.
          for f in test-reception-*.mjs; do suites="$suites ${f%.mjs}"; done
          # LE SITE PUBLIC (Bloc 3, 7 octobre 2026) : le formulaire et la mise en
          # page ordinateur se mesurent sur le site construit. Ni l'une ni
          # l'autre ne tournait ici — la façade pouvait casser « Voir mon prix »
          # sans que rien ne tombe. Toute suite « test-public-* » est prise.
          for f in test-public-*.mjs; do suites="$suites ${f%.mjs}"; done
          suites="$suites test-nouveau-exploitant test-nouveau-serveur test-nouveau-contact test-nouveau-whatsapp test-nouveau-chauffeurs test-nouveau-registre test-nouveau-mdp test-nouveau-bascule test-nouveau-lieux test-nouveau-recherche test-recherche-rapide test-nouveau-sans-blocage test-nouveau-preavis test-securite-fonctions test-relance-alertes test-cloisonnement-hotel test-nouveau-reception test-easyhotel-client"
          # LES SUITES QUI GARDENT LE PRIX ET LE TUNNEL (audit du 9 octobre 2026) :
          # elles ne tournaient qu'en local, donc pas du tout le jour où l'on
          # oublie. Le prix est ferme donc opposable ; ce qui le calcule et ce
          # qui le lit sur le serveur doit tourner avant la fusion. Toutes
          # vertes en local le 9/10 avant d'entrer ici.
          suites="$suites test-nouveau-prix test-nouveau-hotel test-nouveau-confirmation test-nouveau-bon test-nouveau-itineraire test-tarifs-serveur test-demo-hotel test-pro-page test-pro-formulaire"
          # LA FINITION COMMUNE DES PAGES D'HÔTEL (11 octobre 2026) : un second
          # partenaire ajouté à HOTELS doit avoir la finition d'easyHotel, à ses
          # couleurs, sans une ligne de code de plus — et easyHotel ne bouge pas.
          suites="$suites test-finition-commune"
          # LES PAGES D'ACQUISITION ET LA GRILLE DU SITE PUBLIC : les pages /en/,
          # l'origine qui part avec la demande, puis (23 octobre 2026) les
          # tranches, les forfaits Paris et l'accueil — et plus aucun prix
          # réglé page par page. Un prix affiché qui ne serait pas le prix
          # facturé est opposable.
          suites="$suites test-seo-en test-grille-publique test-nouveau-option"
          # LES LIENS DES PARTENAIRES (15 octobre 2026) : le code d'un partenaire
          # suit le visiteur de la page à la demande, l'admin lit ce que chaque
          # lien amène, et le rappel d'avis compte les clients de la semaine.
          suites="$suites test-liens-suivi"
          # LA MESURE DU TRAFIC (15 octobre 2026) : le collecteur sur le site
          # construit — de Google à la réservation, et une panne de la mesure
          # qui ne touche pas le dépôt. L'écran de l'admin est pris d'office
          # (test-admin-trafic), la fonction par test-securite-fonctions.
          suites="$suites test-mesure"
          # LE VOYAGEUR ÉTRANGER DE BOUT EN BOUT (15 octobre 2026, audit des
          # quatre prompts) : page /en/, « Book », moteur en anglais, prix,
          # récapitulatif, envoi, bon — et les pannes (compteur muet, dépôt
          # refusé). C'est elle qui a trouvé le bon qui disait « Demande reçue »
          # au-dessus de « n'a pas pu nous être transmise ».
          suites="$suites test-parcours-en"
          # LA SONDE DU MONITORING (20 octobre 2026) : le monitoring réserve pour
          # de vrai sur le site en ligne ; une sonde qui se tromperait
          # enregistrerait une fausse course. Éprouvée ici, hors ligne.
          suites="$suites test-monitoring-sonde"
          # LES SUITES QUI NE TOURNAIENT QU'À LA MAIN (audit du 31 octobre
          # 2026) : la recherche d'adresse, la carte, « Me localiser », les
          # langues, « Mes réservations » (un morceau du P0 #399), le paiement
          # par lien, les garde-fous, les cartes de services, la suppression,
          # l'affiche QR (décodée par jsQR), l'icône de l'espace exploitant.
          # Aucun workflow ne les lançait : la CI restait verte si l'une
          # tombait. test-doc.mjs refuse désormais toute suite du dépôt
          # qu'aucun workflow ne lance.
          suites="$suites test-nouveau test-nouveau-carte test-nouveau-geoloc test-nouveau-langues test-nouveau-courses test-nouveau-paiement test-nouveau-gardes test-nouveau-services test-nouveau-suppression test-nouveau-affiche test-nouveau-icone test-agent-rbac"
          # Sans navigateur ni réseau : le juge du voyant, qui est aussi celui
          # du chien de garde ; le comparateur des protections de main
          # (20/10/2026), qui doit nommer chaque écart, ni plus ni moins ; /etat
          # et le crochet de début de session (24/10/2026), avec un faux « gh » ;
          # le texte de l'alerte qui réveille Barbaros, et le chiffrement des
          # notifications au client DÉCHIFFRÉ PAR UN TIERS (http_ece, 31/10).
          suites="$suites test-chien-de-garde test-protections test-etat test-notification test-push"
          # UNE SUITE À LA FOIS : plusieurs écoutent sur les mêmes ports, et
          # toutes celles qui construisent effacent le même dossier site/. Le
          # contrôle ne s'arrête jamais à la première rouge.
          # LA DURÉE DE CHAQUE SUITE, ET UN PLAFOND PAR SUITE (1er novembre
          # 2026, audit de la CI). Les durées n'étaient écrites nulle part :
          # l'audit a dû les reconstituer, et l'outil qui lit les journaux n'en
          # rend que les 5 000 dernières lignes (les 22 premières suites y
          # étaient invisibles). Elles vont dans le résumé du passage, les plus
          # lentes en tête. Le plafond : une suite figée bloquait tout le
          # contrôle jusqu'à son propre plafond, sans liste des suites tombées ;
          # elle est arrêtée à 15 min (la plus longue en dure 3), NOMMÉE comme
          # figée, et les autres continuent.
          plafond=15m
          durees="$RUNNER_TEMP/durees.tsv"; : > "$durees"
          echecs=""
          for t in $suites; do
            debut=$(date +%s)
            echo "::group::$t"
            if timeout --kill-after=30s "$plafond" node "$t.mjs"; then
              etat="au vert"
            else
              code=$?
              case $code in
                124|137) etat="FIGÉE, arrêtée au plafond de $plafond";;
                *) etat="TOMBÉE (code $code)";;
              esac
              echo "::error::$t : $etat"
              echecs="$echecs $t"
            fi
            d=$(( $(date +%s) - debut ))
            echo "$t : $etat — $d s"
            echo "::endgroup::"
            printf '%s\t%s\t%s\n' "$d" "$t" "$etat" >> "$durees"
          done
          {
            echo "### Durée de chaque suite"
            echo ""
            echo "$(wc -l < "$durees") suites, $(awk -F'\t' '{s+=$1} END {print s}' "$durees") s en tout."
            echo ""
            echo "| Suite | Durée | État |"
            echo "|---|---:|---|"
            sort -t"$(printf '\t')" -k1,1nr "$durees" | while IFS="$(printf '\t')" read -r d t e; do
              echo "| \`$t\` | $d s | $e |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$echecs" ]; then echo "Suites tombées :$echecs"; exit 1; fi
          echo "Toutes les suites de l'admin retenu sont au vert."
