name: Contrôle sécurité

on:
  pull_request:
  push:
    branches:
      - 'security/**'

permissions:
  contents: read

jobs:
  secrets-publics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Vérifier qu'aucune service-role key Supabase n'est publiée
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIE --exclude-dir=.git --exclude='*.md' --exclude='security-regression.yml' 'service_role.{0,40}(eyJ|sb_secret_)' .; then
            echo 'Clé service-role potentiellement publiée'
            exit 1
          fi

      - name: Construire exactement le site qui serait publié
        shell: bash
        run: bash construire.sh

      - name: Vérifier le verrou exploitant publié
        shell: bash
        run: |
          set -euo pipefail
          admin=site/ela-admin/index.html
          test -f "$admin"
          grep -Fq 'id="exploitantEmail"' "$admin"
          grep -Fq 'id="exploitantMdp"' "$admin"
          grep -Fq '/rest/v1/rpc/est_exploitant' "$admin"
          grep -Fq 'nuage.estExploitant' "$admin"
          if grep -Eq 'CODE_EXPLOITANT|ela_exploitant|id="codeExploitant"|empreinte\(saisi\)' "$admin"; then
            echo "Ancien verrou exploitant détecté dans $admin"
            exit 1
          fi
          for f in site/index.html site/application.html site/easyhotel-reception/index.html; do
            if grep -Eq 'id="exploitantEmail"|id="exploitantMdp"|/rest/v1/rpc/est_exploitant|class="admin-nav"' "$f"; then
              echo "Interface ou RBAC Admin divulgué dans $f"
              exit 1
            fi
          done

      - name: Vérifier que la réservation publique reste présente
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'id="depart"' site/index.html
          grep -Fq 'id="arrivee"' site/index.html
          grep -Fq 'id="btnVoirPrix"' site/index.html
          grep -Fq 'id="btnConfirmer"' site/index.html
          grep -Fq 'courses-hotel' site/easyhotel-reception/index.html
          if grep -Fq 'coursesHotel: function' site/index.html site/application.html; then
            echo 'API Réception divulguée dans un espace client'
            exit 1
          fi

      - name: Vérifier la passerelle de réservation publique
        shell: bash
        run: |
          set -euo pipefail
          for f in site/index.html site/application.html; do
            grep -Fq '/functions/v1/deposer-course' "$f"
            if grep -Fq 'fetch(SUPABASE_URL + "/rest/v1/courses"' "$f"; then
              echo "Dépôt public direct encore présent dans $f"
              exit 1
            fi
          done
          fn='supabase/functions/deposer-course/index.ts'
          grep -Fq 'consommer_quota_reservation' "$fn"
          grep -Fq 'statut:"attente"' "$fn"
          grep -Fq 'entierPassagers(c.passagers)' "$fn"
          grep -Fq 'prixServeurVerifie:false' "$fn"
          grep -Fq 'référence déjà utilisée' "$fn"
          grep -Fq 'grant execute on function public.consommer_quota_reservation' supabase/migrations/20260916060000_public_booking_rate_limit.sql
