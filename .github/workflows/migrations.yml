# =====================================================================
# APPLIQUER UNE MIGRATION SQL CHEZ SUPABASE
# ---------------------------------------------------------------------
# POURQUOI CE FICHIER EXISTE : Barbaros travaille depuis un téléphone, et
# l'éditeur SQL du tableau de bord Supabase se manie mal au pouce. Les
# migrations de « supabase/migrations/ » étaient écrites dans le dépôt et
# appliquées à la main — donc parfois pas appliquées du tout, exactement
# ce qui est arrivé à « nouvelle-demande » pendant des semaines.
#
# IL NE PART JAMAIS TOUT SEUL. « workflow_dispatch » et rien d'autre :
# une poussée de code ne doit pas pouvoir modifier la base de production
# sans que quelqu'un l'ait demandé. C'est la différence avec
# « fonctions.yml », qui ne fait que redéployer du code.
#
# IL N'ACCEPTE QU'UN FICHIER DU DÉPÔT, jamais du SQL tapé dans le
# formulaire : un champ libre ferait de ce workflow une porte ouverte sur
# la base pour quiconque obtient un accès au dépôt. Ce qu'on applique est
# ce qui a été relu et committé.
#
# CE FICHIER NE TOUCHE PAS AU SITE. « construire.sh » reste la seule
# recette de publication.
# =====================================================================
name: Appliquer une migration Supabase

on:
  workflow_dispatch:
    inputs:
      fichier:
        description: "Fichier SQL de supabase/migrations/ à appliquer"
        required: true
        default: "20260915_supprimer_course.sql"

jobs:
  appliquer:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJET: yyhzutnuhuytokarynaw
      FICHIER: ${{ inputs.fichier }}
    steps:
      - uses: actions/checkout@v7

      - name: Vérifier que le jeton est posé
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Le secret SUPABASE_ACCESS_TOKEN n'est pas posé sur ce dépôt."
            exit 1
          fi

      # LE NOM EST CONTRÔLÉ AVANT D'ÊTRE UTILISÉ. Sans ça, « ../../quelque
      # chose » sortirait du dossier des migrations et ce workflow
      # exécuterait n'importe quel fichier du dépôt sur la base.
      # LE JETON D'ABORD, LA MIGRATION ENSUITE. Un 401 sur la requête finale
      # ne dit pas si le jeton est mort ou si c'est l'appel qui est mal
      # formé : on interroge donc d'abord une adresse qui ne fait rien, et
      # on sait lequel des deux est en cause. Aucune valeur secrète n'est
      # affichée, seulement des codes de réponse.
      - name: Éprouver le jeton sur une lecture inoffensive
        run: |
          code=$(curl -sS -o projets.json -w '%{http_code}' \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            https://api.supabase.com/v1/projects)
          echo "Lecture des projets : HTTP $code"
          if [ "$code" = "200" ]; then
            echo "Le jeton est valide. Projets visibles :"
            jq -r '.[].id' projets.json || true
          else
            echo "Le jeton est REFUSÉ par l'API de gestion."
            cat projets.json; echo
            echo "Il faut en refaire un sur supabase.com/dashboard/account/tokens"
            echo "et le reposer dans le secret GitHub SUPABASE_ACCESS_TOKEN."
            exit 1
          fi

      - name: Contrôler le nom du fichier
        run: |
          case "$FICHIER" in
            *[!A-Za-z0-9_.-]* | *..* | "" )
              echo "Nom de fichier refusé : $FICHIER"; exit 1 ;;
          esac
          case "$FICHIER" in
            *.sql ) ;;
            * ) echo "Ce n'est pas un fichier .sql : $FICHIER"; exit 1 ;;
          esac
          test -f "supabase/migrations/$FICHIER" \
            || { echo "Introuvable : supabase/migrations/$FICHIER"; exit 1; }
          echo "Fichier retenu : supabase/migrations/$FICHIER"

      # ON MONTRE CE QU'ON VA EXÉCUTER. Une migration appliquée sans trace
      # de son contenu est impossible à relire le jour où quelque chose
      # cloche — et le journal du workflow est la seule trace qu'on aura.
      - name: Afficher le SQL
        run: cat "supabase/migrations/$FICHIER"

      # L'API de gestion exécute le SQL comme le ferait l'éditeur du
      # tableau de bord. On envoie le fichier tel quel, encodé par « jq »
      # pour qu'aucun guillemet ni accent ne casse le corps JSON.
      - name: Exécuter sur la base
        run: |
          corps=$(jq -Rs '{query: .}' < "supabase/migrations/$FICHIER")
          code=$(curl -sS -o reponse.json -w '%{http_code}' \
            -X POST "https://api.supabase.com/v1/projects/$PROJET/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$corps")
          echo "Réponse HTTP : $code"
          cat reponse.json
          echo
          # UN ÉCHEC DOIT ÊTRE UN ÉCHEC. Sans ce contrôle, une migration
          # refusée passerait pour appliquée et on chercherait le défaut
          # dans le site pendant des heures.
          case "$code" in
            2* ) echo "Migration appliquée." ;;
            * )  echo "La base a refusé la migration."; exit 1 ;;
          esac
