# =====================================================================
# DÉPLOIEMENT DES FONCTIONS SUPABASE
# ---------------------------------------------------------------------
# Ce workflow déploie les fonctions versionnées dans le dépôt. Les secrets
# restent dans GitHub/Supabase et ne sont jamais écrits dans le code.
# =====================================================================
name: Déployer les fonctions Supabase

on:
  push:
    branches: [main, mini-van]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/fonctions.yml"
  workflow_dispatch:

jobs:
  deployer:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJET: yyhzutnuhuytokarynaw
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Vérifier que le jeton est posé
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Le secret SUPABASE_ACCESS_TOKEN n'est pas posé sur ce dépôt."
            exit 1
          fi

      - name: Déployer nouvelle-demande
        run: supabase functions deploy nouvelle-demande --project-ref "$PROJET"

      - name: Déployer prevenir-client
        run: supabase functions deploy prevenir-client --project-ref "$PROJET"

      - name: Déployer etat-course
        run: supabase functions deploy etat-course --project-ref "$PROJET"

      - name: Déployer courses-hotel
        run: supabase functions deploy courses-hotel --project-ref "$PROJET"

      # Fonction publique par définition : le navigateur n'a pas de session
      # utilisateur. Elle applique elle-même CORS strict, quota, validation,
      # liste blanche et statut serveur. Ne jamais retirer ces contrôles si
      # --no-verify-jwt reste nécessaire.
      - name: Déployer deposer-course
        run: supabase functions deploy deposer-course --no-verify-jwt --project-ref "$PROJET"
