# =====================================================================
# DÉPLOIEMENT DES FONCTIONS SUPABASE
# ---------------------------------------------------------------------
# POURQUOI CE FICHIER EXISTE : Barbaros travaille depuis un téléphone.
# Coller 300 lignes dans l'éditeur du tableau de bord Supabase avec un
# pouce ne marche pas — essayé, l'éditeur de code refuse le collage sur
# iPhone. Sans ce workflow, les fonctions restent écrites et jamais
# déployées, ce qui est exactement ce qui s'est passé pendant des
# semaines pour « nouvelle-demande ».
#
# CE FICHIER NE TOUCHE PAS AU SITE. « construire.sh » reste la seule
# recette de publication, et « pages.yml » son seul appelant. Ici on ne
# déploie que du code qui tourne chez Supabase.
#
# CE QU'IL FAUT UNE SEULE FOIS : un secret GitHub nommé
# SUPABASE_ACCESS_TOKEN, fabriqué sur supabase.com/dashboard/account/tokens.
# Il n'est PAS dans le dépôt — il donne accès au compte, il vit dans les
# secrets GitHub, comme les jetons VAPID vivent dans ceux de Supabase.
# =====================================================================
name: Déployer les fonctions Supabase

on:
  push:
    # La branche de travail y est aussi : sans elle, il faudrait fusionner
    # vers main avant d'avoir pu éprouver le déploiement une seule fois.
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/fonctions.yml"
  workflow_dispatch:

jobs:
  deployer:
    # SEULE « main » DÉPLOIE (audit du 2 octobre 2026). Le déclencheur
    # « push » ne vise déjà que main, mais « workflow_dispatch » s'exécute
    # sur la branche choisie dans le menu : depuis une vieille branche, il
    # aurait remis en production des fonctions d'avant les correctifs du
    # 28/09 (prevenir-client ouverte à tous, nouvelle-demande qui croit le
    # corps reçu). La garde ferme ce chemin ; le bouton reste pour main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # SEULE « main » DÉPLOIE, ET C'EST L'ENVIRONNEMENT QUI LE GARANTIT
    # (2 octobre 2026). Retirer une branche de la liste « branches: » ne
    # protège que la copie de CE fichier qui est sur main : GitHub exécute
    # la copie présente sur la branche poussée, et 45 branches en portaient
    # encore une qui déployait depuis « mini-van » — avec des fonctions du
    # 11 septembre, sans les correctifs de sécurité du 28. Le jeton vit donc
    # dans l'environnement « production », restreint à main dans les
    # réglages du dépôt : une vieille copie se retrouve sans jeton et
    # s'arrête à la première étape. Le contrôle d'étape ci-dessous dit la
    # même chose à voix haute pour un lancement manuel depuis une autre
    # branche.
    environment: production
    # La référence du projet n'est pas un secret : elle est déjà dans
    # l'adresse du serveur, écrite en clair dans la page du site.
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJET: yyhzutnuhuytokarynaw
    steps:
      - name: Refuser toute branche autre que main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Ce workflow ne déploie que depuis main. Branche reçue : $GITHUB_REF"
            echo "Fusionner d'abord, puis laisser la poussée sur main déployer."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # ON S'ARRÊTE NET SI LE JETON MANQUE. Sans ce contrôle, la commande
      # échouerait plus loin avec un message d'authentification que
      # personne ne rattacherait au secret oublié.
      - name: Vérifier que le jeton est posé
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Le secret SUPABASE_ACCESS_TOKEN n'est pas posé sur ce dépôt."
            echo "Le créer sur supabase.com/dashboard/account/tokens,"
            echo "puis Settings > Secrets and variables > Actions > New secret."
            exit 1
          fi

      # « nouvelle-demande » prévient Barbaros, « prevenir-client » prévient
      # le client. Les deux sont appelées avec un en-tête d'autorisation —
      # le webhook de Supabase pour l'une, la session de l'exploitant pour
      # l'autre — donc on GARDE la vérification du jeton. La désactiver
      # ouvrirait les deux fonctions à n'importe qui sur Internet.
      - name: Déployer nouvelle-demande
        run: supabase functions deploy nouvelle-demande --project-ref "$PROJET"

      # « telegram-bot » reçoit l'appui sur « ✅ Vu » sous une alerte. Telegram
      # n'envoie pas de JWT : la fonction vérifie elle-même l'en-tête secret
      # posé à l'installation du webhook, et que l'appui vient de SA
      # conversation.
      - name: Déployer telegram-bot
        run: supabase functions deploy telegram-bot --no-verify-jwt --project-ref "$PROJET"

      - name: Déployer prevenir-client
        run: supabase functions deploy prevenir-client --project-ref "$PROJET"

      # « etat-course » rend au CLIENT l'état de SA course. Elle est appelée
      # depuis la page publique, donc avec la clé anonyme — qui est un jeton
      # valide : la vérification reste activée comme pour les deux autres.
      # Ce qui protège ici n'est pas le jeton (il est public) mais le couple
      # référence + téléphone exigé dans le corps de l'appel.
      - name: Déployer etat-course
        run: supabase functions deploy etat-course --project-ref "$PROJET"

      # « cle-notifications » rend la clé PUBLIQUE des notifications, posée
      # dans les secrets. Appelée par la page avec la clé anonyme, comme
      # etat-course : la vérification du jeton reste activée.
      - name: Déployer cle-notifications
        run: supabase functions deploy cle-notifications --project-ref "$PROJET"

      # « courses-hotel » rend à la RÉCEPTION d'un hôtel partenaire les
      # courses de CET hôtel. Elle est appelée depuis la page, donc avec la
      # clé anonyme, et la vérification du jeton reste activée comme pour
      # les autres. Ce qui protège ici n'est pas ce jeton — il est public —
      # mais le CODE de l'hôtel, vérifié dans la fonction contre un secret
      # Supabase qui n'est nulle part dans le site.
      - name: Déployer courses-hotel
        run: supabase functions deploy courses-hotel --project-ref "$PROJET"

      # « deposer-course » reçoit les demandes du site public. Il n'existe
      # volontairement aucune session client : la fonction applique donc
      # elle-même CORS strict, quota, validation, liste blanche des champs,
      # idempotence et statut « attente » imposé côté serveur.
      - name: Déployer deposer-course
        run: supabase functions deploy deposer-course --no-verify-jwt --project-ref "$PROJET"

      # Stripe reste en TEST : creer-empreinte ne reçoit pas de session
      # client mais exige référence + téléphone et un snapshot financier
      # serveur verrouillé. Capture/annulation exigent une session exploitant.
      - name: Déployer creer-empreinte
        run: supabase functions deploy creer-empreinte --no-verify-jwt --project-ref "$PROJET"
      - name: Déployer capturer-paiement
        run: supabase functions deploy capturer-paiement --project-ref "$PROJET"
      - name: Déployer annuler-empreinte
        run: supabase functions deploy annuler-empreinte --project-ref "$PROJET"

      # Stripe signe lui-même les webhooks : pas de JWT Supabase, mais une
      # signature HMAC Stripe obligatoire et une déduplication par event_id.
      - name: Déployer stripe-webhook
        run: supabase functions deploy stripe-webhook --no-verify-jwt --project-ref "$PROJET"
