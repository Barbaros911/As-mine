# ═══════════════════════════════════════════════════════════════════════
# SURVEILLANCE DES ALERTES — le chien de garde qui ne dépend de rien d'ELA
# ───────────────────────────────────────────────────────────────────────
# 02/10/2026. La relance (20 s) et la sentinelle (1 min) tournent DANS
# Supabase, par pg_cron, et parlent par Telegram. Si pg_cron s'arrête, si
# le projet Supabase tombe, ou si Telegram refuse tout, aucune d'elles ne
# peut le dire : elles sont à terre avec le reste.
# Ce workflow tourne chez GITHUB. Toutes les 15 min il demande à la
# fonction « pilotage » un bilan de santé ({type:"SANTE"}) et, si quelque
# chose est critique — demande jamais annoncée, relance ou sentinelle
# arrêtée, Telegram en échec, serveur muet — il ouvre UNE Issue. GitHub
# l'envoie par e-mail et dans son application : un canal qui ne passe ni
# par Supabase ni par Telegram.
#
# LA RÉPONSE NE PORTE QUE DES CODES (« relance », « non_annoncee »…), jamais
# une référence ni un trajet : l'appel se fait avec la clé publique du site,
# et ce journal de workflow est public.
#
# GitHub ne garantit pas l'heure exacte d'un « schedule » (souvent quelques
# minutes de retard). C'est un filet de dernier recours, pas le premier.
# On réessaie une fois avant de crier ; l'Issue se ferme seule au retour à
# la normale.
# ═══════════════════════════════════════════════════════════════════════
name: Surveillance des alertes

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ela-surveillance-alertes
  cancel-in-progress: false

jobs:
  sante:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Clé PUBLIQUE du site : elle est déjà écrite en clair dans la page et
      # dans les migrations. Jamais la clé service_role ici.
      URL: https://yyhzutnuhuytokarynaw.supabase.co/functions/v1/pilotage
      CLE: sb_publishable_hNYqURatjlXc8tYC30XKpA_2VG91UAj
    steps:
      - name: Demander le bilan de santé
        id: bilan
        shell: bash
        run: |
          demander() {
            curl -sS --max-time 40 -X POST "$URL" \
              -H "Content-Type: application/json" -H "apikey: $CLE" -H "Authorization: Bearer $CLE" \
              -d '{"type":"SANTE"}' -o "$RUNNER_TEMP/sante.json" -w '%{http_code}' || echo "000"
          }
          juger() {
            code="$1"
            if [ "$code" != "200" ]; then echo "serveur_http_$code"; return; fi
            node -e '
              const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
              const codes = Array.isArray(r.codes) ? r.codes.filter(c => /^[a-z_0-9]{1,40}$/.test(c)) : ["reponse_illisible"];
              process.stdout.write(r.ok === true ? "ok" : (codes.join(",") || "inconnu"));
            ' "$RUNNER_TEMP/sante.json" 2>/dev/null || echo "reponse_illisible"
          }
          premier=$(juger "$(demander)")
          echo "Premier passage : $premier"
          if [ "$premier" != "ok" ]; then
            sleep 60
            second=$(juger "$(demander)")
            echo "Second passage : $second"
            echo "etat=$second" >> "$GITHUB_OUTPUT"
          else
            echo "etat=ok" >> "$GITHUB_OUTPUT"
          fi

      - name: Ouvrir ou clore l'incident
        if: always()
        uses: actions/github-script@v8
        env:
          ETAT: ${{ steps.bilan.outputs.etat }}
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const marqueur = "<!-- ela-surveillance-alertes -->";
            const etat = process.env.ETAT || "workflow_en_echec";
            const ouvertes = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: "open", per_page: 100 });
            const incident = ouvertes.find(i => !i.pull_request && i.body && i.body.includes(marqueur));
            const lien = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const pied = ["", "---", "_Generated by [Claude Code](https://claude.ai/code)_"];
            if (etat === "ok") {
              if (incident) {
                await github.rest.issues.createComment({ owner, repo, issue_number: incident.number, body: ["## Retour à la normale", "", `Le bilan de santé est repassé au vert. Passage : ${lien}`, ...pied].join("\n") });
                await github.rest.issues.update({ owner, repo, issue_number: incident.number, state: "closed", state_reason: "completed" });
              } else core.notice("Alertes ELA : tout est en ordre.");
              return;
            }
            const sens = {
              non_annoncee: "une demande est arrivée en base et AUCUNE alerte n'a réussi depuis plus de 3 min",
              relance: "la relance automatique (pg_cron, toutes les 20 s) ne tourne plus",
              sentinelle: "la sentinelle (pg_cron, chaque minute) ne tourne plus",
              telegram: "les derniers envois Telegram échouent",
              sans_chauffeur: "une course confirmée part dans moins de 30 min sans chauffeur",
              lecture_base: "la fonction n'arrive plus à lire la base",
              reponse_illisible: "la fonction répond quelque chose d'inattendu",
            };
            const lignes = etat.split(",").map(c => `- \`${c}\` — ${sens[c] || (c.startsWith("serveur_http_") ? "la fonction « pilotage » ne répond pas (Supabase en panne, ou fonction non déployée)" : "voir le journal")}`);
            const corps = [marqueur, "## P0 — la surveillance des réservations signale un problème", "", `Détecté : ${new Date().toISOString()}`, `Passage : ${lien}`, "", "Deux passages consécutifs, à une minute d'intervalle :", "", ...lignes, "", "**Ouvrir l'admin tout de suite** : https://elatransfer.com/ela-admin/ — les demandes y arrivent même quand les alertes sont muettes.", ...pied].join("\n");
            if (incident) {
              await github.rest.issues.createComment({ owner, repo, issue_number: incident.number, body: ["Toujours en cours :", "", ...lignes, "", `Passage : ${lien}`, ...pied].join("\n") });
            } else {
              const i = await github.rest.issues.create({ owner, repo, title: "[ALERTES] La surveillance des réservations signale un problème", body: corps });
              core.warning(`Incident #${i.data.number} ouvert.`);
            }
