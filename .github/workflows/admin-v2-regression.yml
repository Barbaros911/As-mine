name: Contrôle Admin v2
on:
  pull_request:
    paths:
      - 'admin-v2*'
      - 'intake-demande.js'
      - 'qr-affiche.js'
      - 'test-admin-*.mjs'
      - 'construire.sh'
      - 'supabase/**'
      - '.github/workflows/admin-v2-regression.yml'
permissions: {contents: read}
jobs:
  verifier:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check admin-v2-actions.js
      - run: bash construire.sh
      - name: Vérifier Admin v2
        shell: bash
        run: |
          set -euo pipefail
          test -f site/admin-v2.html
          test -f site/admin-v2-responsive.css
          grep -Fq '/admin-v2-responsive.css' site/admin-v2.html
          grep -Fq '/auth/v1/token?grant_type=password' site/admin-v2.html
          grep -Fq '/rest/v1/rpc/est_exploitant' site/admin-v2.html
          grep -Fq 'actions_requises' site/admin-v2.html
          grep -Fq 'chauffeurs' site/admin-v2.html
          grep -Fq 'partenaires' site/admin-v2.html
          grep -Fq 'codes_promo' site/admin-v2.html
          grep -Fq 'paiements' site/admin-v2.html
          grep -Fq 'snapshots_financiers' site/admin-v2.html
          grep -Fq 'brand-logo.webp' site/admin-v2.html
          node test-admin-responsive.mjs
          if grep -Eq 'CODE_EXPLOITANT|ela_exploitant|service_role|sk_(test|live)_' site/admin-v2.html; then
            echo 'Secret ou ancien verrou détecté dans Admin v2'
            exit 1
          fi
      - name: Les papiers décident, pas une liste déroulante
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.56.1 jsqr
          npx playwright install --with-deps chromium
          node test-admin-papiers.mjs
          node test-admin-intake.mjs
          node test-admin-registre.mjs
          node test-admin-factures.mjs
          node test-admin-gestes.mjs
          node test-admin-affiche.mjs
      - name: La migration, exécutée et non relue
        shell: bash
        env: {PGPASSWORD: postgres}
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 -f supabase/tests/socle.sql -f supabase/migrations/20260916140000_chauffeurs_papiers.sql -f supabase/tests/papiers-chauffeurs.sql
          psql -h 127.0.0.1 -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 -c 'create database intake;'
          psql -h 127.0.0.1 -U postgres -d intake -X -q -v ON_ERROR_STOP=1 -f supabase/tests/socle.sql -f supabase/migrations/20260916140000_chauffeurs_papiers.sql -f supabase/migrations/20260916220000_intake_exploitant.sql -f supabase/tests/intake-exploitant.sql
          psql -h 127.0.0.1 -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 -c 'create database registre;'
          psql -h 127.0.0.1 -U postgres -d registre -X -q -v ON_ERROR_STOP=1 -f supabase/tests/socle.sql -f supabase/migrations/20260916140000_chauffeurs_papiers.sql -f supabase/migrations/20260916220000_intake_exploitant.sql -f supabase/migrations/20260917000000_registre_restauration.sql -f supabase/tests/registre-restauration.sql
          psql -h 127.0.0.1 -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 -c 'create database factures;'
          psql -h 127.0.0.1 -U postgres -d factures -X -q -v ON_ERROR_STOP=1 -f supabase/tests/socle.sql -f supabase/migrations/20260916140000_chauffeurs_papiers.sql -f supabase/migrations/20260917010000_factures_commission.sql -f supabase/tests/factures-commission.sql
          psql -h 127.0.0.1 -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 -c 'create database gestes;'
          psql -h 127.0.0.1 -U postgres -d gestes -X -q -v ON_ERROR_STOP=1 -f supabase/tests/socle.sql -f supabase/migrations/20260917020000_gestes_client.sql -f supabase/tests/gestes-client.sql
