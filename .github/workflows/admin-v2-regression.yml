name: Contrôle Admin v2
on:
  pull_request:
    # ON FILTRE PAR MOTIF, PAS PAR LISTE DE FICHIERS. La liste d'origine
    # nommait les quatre fichiers qui existaient le jour ou elle a ete
    # ecrite : « intake-demande.js » -- le lecteur PARTAGE par les deux
    # espaces -- n'y etait pas, ni « admin-v2-registre.js », ni deux des
    # trois suites. Les modifier seuls n'aurait declenche AUCUN controle,
    # et rien ne l'aurait signale : une liste ecrite en dur survit au
    # changement qui l'invalide. Meme famille que la barre du bas figee
    # sur quatre onglets, et que le lanceur qui ne ramassait que
    # « test-nouveau* ». Un controle de « test-doc.mjs » verifie desormais
    # que tout fichier d'Admin v2 present dans le depot est couvert ici.
    paths:
      - 'admin-v2*'
      - 'intake-demande.js'
      - 'telephone.js'
      - 'qr-affiche.js'
      - 'itineraire-partage.js'
      # Le module du Pilotage : son miroir des règles est éprouvé contre la
      # vraie base dans l'étape HTTP ci-dessous.
      - 'pilotage.js'
      - 'test-admin-*.mjs'
      - 'capture-admin.mjs'
      - 'construire.sh'
      - 'supabase/**'
      - '.github/workflows/admin-v2-regression.yml'
permissions: {contents: read}
jobs:
  verifier:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with: {node-version: '22'}
      - run: node --check admin-v2-actions.js
      - run: bash construire.sh
        # Admin v2 n'est plus publié : ce contrôle le demande explicitement.
        env:
          ELA_AVEC_ADMIN_V2: "1"
      - name: Vérifier Admin v2
        shell: bash
        run: |
          set -euo pipefail
          test -f site/admin-v2.html
          test -f site/admin-v2-responsive.css
          grep -Fq '/admin-v2-responsive.css' site/admin-v2.html
          grep -Fq '/auth/v1/token?grant_type=password' site/admin-v2.html
          grep -Fq '/rest/v1/rpc/est_exploitant' site/admin-v2.html
          grep -Fq 'actions_requises' site/admin-v2.html
          grep -Fq 'chauffeurs' site/admin-v2.html
          grep -Fq 'partenaires' site/admin-v2.html
          grep -Fq 'codes_promo' site/admin-v2.html
          grep -Fq 'paiements' site/admin-v2.html
          grep -Fq 'snapshots_financiers' site/admin-v2.html
          # LE LOGO EST OFFICIEL — ET C'EST LA RÈGLE, PAS UN NOM DE FICHIER.
          # Ce contrôle exigeait « brand-logo.webp » : il est donc resté vert
          # le jour où ce logo bleu nuit s'est retrouvé posé sur un bandeau
          # bleu nuit, invisible, et il a ensuite refusé la CORRECTION — la
          # variante blanche officielle, déjà employée par le site client.
          # Un nom de fichier figé survit au changement qui l'invalide, et se
          # met en travers du premier correctif légitime.
          grep -Eq 'brand-logo(\.webp|-white\.png)' site/admin-v2.html
          # Ce qui reste interdit, lui, ne bouge pas : aucun logo redessiné,
          # donc aucune autre image en guise d'enseigne.
          if grep -Eo 'src="[^"]*"' site/admin-v2.html | grep -Eq 'logo' \
             && grep -Eo 'src="[^"]*logo[^"]*"' site/admin-v2.html \
                | grep -Evq 'brand-logo(\.webp|-white\.png|\.svg)'; then
            echo 'Une image de logo NON officielle est servie par Admin v2'
            exit 1
          fi
          if grep -Eq 'CODE_EXPLOITANT|ela_exploitant|service_role|sk_(test|live)_' site/admin-v2.html; then
            echo 'Secret ou ancien verrou détecté dans Admin v2'
            exit 1
          fi

      # LA SUITE NAVIGATEUR, ET C'EST LA PREMIÈRE DU DÉPÔT À TOURNER EN CI.
      # Les vingt-huit autres ne tournent que sur la machine de travail : elles
      # sont donc restées rouges quatre jours sans que rien ne le dise. Les y
      # brancher toutes est une décision à part -- durée, instabilité ; celle-ci
      # est branchée parce qu'elle garde une règle qui engage une responsabilité.
      - name: Les papiers décident, pas une liste déroulante
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.56.1 jsqr
          npx playwright install --with-deps chromium
          node test-admin-papiers.mjs
          node test-admin-intake.mjs
          node test-admin-factures.mjs
          node test-admin-gestes.mjs
          node test-admin-affiche.mjs
          node test-admin-prix.mjs
          node test-admin-responsive.mjs
          node test-admin-push.mjs
          node test-admin-commission.mjs
          node capture-admin.mjs
      - name: Joindre les captures Admin
        uses: actions/upload-artifact@v4
        with:
          name: captures-admin-pr192
          path: captures-admin/*.png
          if-no-files-found: error

      # LA MIGRATION EST EXÉCUTÉE POUR DE VRAI, sur un PostgreSQL vide.
      # Une expression régulière sur un fichier SQL ne sait pas si la requête
      # s'exécute, ni ce qu'elle rend. Ici on lit le résultat : un papier
      # expiré doit sortir de la liste d'attribution, un papier qui expire
      # aujourd'hui doit y rester, et trois rafraîchissements de la file
      # d'actions ne doivent pas créer de doublons.
      # Éprouvée contre le défaut d'origine : elle s'arrête sur
      # « Ayse est ATTRIBUABLE alors que son assurance a expire ».
      - name: La migration, exécutée et non relue
        shell: bash
        env: {PGPASSWORD: postgres}
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 \
            -f supabase/tests/socle.sql \
            -f supabase/migrations/20260916140000_chauffeurs_papiers.sql \
            -f supabase/tests/papiers-chauffeurs.sql
          # Une base neuve : le socle repose les memes tables, et deux
          # epreuves qui partagent un etat finissent par se gener.
          psql -h 127.0.0.1 -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 -c 'create database intake;'
          psql -h 127.0.0.1 -U postgres -d intake -X -q -v ON_ERROR_STOP=1 \
            -f supabase/tests/socle.sql \
            -f supabase/migrations/20260916140000_chauffeurs_papiers.sql \
            -f supabase/migrations/20260916220000_intake_exploitant.sql \
            -f supabase/tests/intake-exploitant.sql
          # Encore une base neuve : la restauration compte des lignes, et
          # une course laissee par l'epreuve d'a cote fausserait ses totaux.
          psql -h 127.0.0.1 -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 -c 'create database registre;'
          psql -h 127.0.0.1 -U postgres -d registre -X -q -v ON_ERROR_STOP=1 \
            -f supabase/tests/socle.sql \
            -f supabase/migrations/20260916140000_chauffeurs_papiers.sql \
            -f supabase/migrations/20260916220000_intake_exploitant.sql \
            -f supabase/migrations/20260917000000_registre_restauration.sql \
            -f supabase/tests/registre-restauration.sql
          # Encore une base neuve : la facture compte des numeros, et une
          # emission laissee par l'epreuve d'a cote decalerait toute la suite.
          # « dblink » y ouvre une VRAIE seconde session : c'est la seule facon
          # d'eprouver deux emissions concurrentes sur le meme lot, et une
          # divergence de snapshot ne se simule pas dans une transaction.
          psql -h 127.0.0.1 -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 -c 'create database factures;'
          psql -h 127.0.0.1 -U postgres -d factures -X -q -v ON_ERROR_STOP=1 \
            -f supabase/tests/socle.sql \
            -f supabase/migrations/20260916140000_chauffeurs_papiers.sql \
            -f supabase/migrations/20260917010000_factures_commission.sql \
            -f supabase/tests/factures-commission.sql
          # Les gestes vers le client : leur regle d'etat est imposee cote
          # serveur, et c'est la seule facon de l'eprouver.
          psql -h 127.0.0.1 -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 -c 'create database gestes;'
          psql -h 127.0.0.1 -U postgres -d gestes -X -q -v ON_ERROR_STOP=1 \
            -f supabase/tests/socle.sql \
            -f supabase/migrations/20260917020000_gestes_client.sql \
            -f supabase/tests/gestes-client.sql
          # Audit du 28/09/2026 : plus aucune ecriture directe d'anon dans
          # courses. L'epreuve repose l'etat d'origine, verifie qu'il laisse
          # passer, applique les DEUX migrations dans l'ordre de la
          # production, puis exige le refus ET l'absence de toute policy anon.
          # Issue #190 : la policy est reposee sous son vrai nom de production,
          # « depot client ». Sans la migration du 03/10 l'epreuve tombe — c'est
          # l'etat reel de la base tant qu'elle n'est pas appliquee.
          psql -h 127.0.0.1 -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 -c 'create database coursesanon;'
          psql -h 127.0.0.1 -U postgres -d coursesanon -X -q -v ON_ERROR_STOP=1 \
            -f supabase/tests/socle.sql \
            -f supabase/tests/courses-sans-anon.sql \
            -f supabase/migrations/20260928120000_courses_sans_depot_anonyme.sql \
            -f supabase/migrations/20261003000000_courses_policy_depot_client.sql \
            -f supabase/tests/courses-sans-anon-apres.sql
          # Le rôle agent : l'agent est refusé sur les prix, les réglages et
          # l'argent, l'admin passe. Les deux côtés sont éprouvés.
          psql -h 127.0.0.1 -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 -c 'create database roleagent;'
          psql -h 127.0.0.1 -U postgres -d roleagent -X -q -v ON_ERROR_STOP=1 \
            -f supabase/tests/socle.sql \
            -f supabase/migrations/20260916140000_chauffeurs_papiers.sql \
            -f supabase/migrations/20260917000000_registre_restauration.sql \
            -f supabase/migrations/20260917010000_factures_commission.sql \
            -f supabase/tests/role-agent-avant.sql \
            -f supabase/migrations/20260929030000_role_agent_serveur.sql \
            -f supabase/tests/role-agent.sql
          # Le voyant des alertes (4 octobre 2026) : un anonyme ne lit rien,
          # un non-exploitant est refusé par la fonction elle-même, et les
          # mesures disent vrai. Le schéma « cron » n'existe que chez
          # Supabase : l'épreuve en pose un faux avant la migration.
          psql -h 127.0.0.1 -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 -c 'create database sante;'
          psql -h 127.0.0.1 -U postgres -d sante -X -q -v ON_ERROR_STOP=1 \
            -f supabase/tests/socle.sql \
            -f supabase/tests/sante-alertes.sql \
            -f supabase/migrations/20261004010000_sante_alertes.sql \
            -f supabase/tests/sante-alertes-apres.sql
          # Les vues publiques en lecture seule (5 octobre 2026). L'épreuve
          # repose les privilèges par défaut de Supabase et les vues de la VRAIE
          # migration de tarif, exige que le trou SE REPRODUISE (un anonyme
          # efface le tarif berline à travers la vue), puis applique la
          # correction DEUX fois (elle doit se rejouer) et exige le refus, la
          # lecture intacte, et une vue future couverte sans être nommée.
          psql -h 127.0.0.1 -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 -c 'create database vues;'
          psql -h 127.0.0.1 -U postgres -d vues -X -q -v ON_ERROR_STOP=1 \
            -f supabase/tests/socle.sql \
            -f supabase/tests/vues-lecture-seule.sql \
            -f supabase/migrations/20260928120000_tarif_unifie.sql \
            -f supabase/tests/vues-lecture-seule-sonde.sql \
            -f supabase/migrations/20261005000000_vues_lecture_seule.sql \
            -f supabase/migrations/20261005000000_vues_lecture_seule.sql \
            -f supabase/tests/vues-lecture-seule-apres.sql
          # Le diagnostic qui suit la correction en production : il doit
          # s'exécuter, et ne sortir aucune adresse e-mail (journal public).
          psql -h 127.0.0.1 -U postgres -d vues -X -q -v ON_ERROR_STOP=1 \
            -f supabase/tests/diagnostic-cloisonnement-socle.sql
          psql -h 127.0.0.1 -U postgres -d vues -X -q -v ON_ERROR_STOP=1 -t -A \
            -f supabase/migrations/20261005000100_diagnostic_cloisonnement.sql > /tmp/diagnostic.txt
          cat /tmp/diagnostic.txt
          grep -q '"comptes_sans_droit": 1' /tmp/diagnostic.txt \
            || { echo "::error::le diagnostic ne compte pas le compte sans droit"; exit 1; }
          grep -qx 'vues_modifiables|\[\]' /tmp/diagnostic.txt \
            || { echo "::error::le diagnostic voit encore une vue modifiable"; exit 1; }
          if grep -q '@' /tmp/diagnostic.txt; then
            echo "::error::le diagnostic sort une adresse e-mail dans un journal public"; exit 1
          fi
          # Le numéro court « N° 1042 » (5 octobre 2026). Deux sentinelles
          # remplacent les déclencheurs de production dont le code n'est pas
          # dans le dépôt : la numérotation des courses existantes ne doit
          # passer par aucun. Puis : ordre de création à partir de 1001,
          # numéro imposé par le serveur, immuable, unique, et la migration
          # rejouée trois fois sans renuméroter. Éprouvée sans la coupure des
          # déclencheurs, sans l'immuabilité, sans le déclencheur d'insertion :
          # elle tombe les trois fois.
          psql -h 127.0.0.1 -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 -c 'create database numero;'
          psql -h 127.0.0.1 -U postgres -d numero -X -q -v ON_ERROR_STOP=1 \
            -f supabase/tests/socle.sql \
            -f supabase/migrations/20261002000000_courses_version.sql \
            -f supabase/tests/numero-court.sql \
            -f supabase/migrations/20261006000000_numero_court.sql \
            -f supabase/migrations/20261006000000_numero_court.sql \
            -f supabase/tests/numero-court-apres.sql
          # Le Pilotage (Issue #197, bloc 1, 6 octobre 2026). Le décor repose
          # les opérateurs sous leur vraie RLS, la VRAIE est_admin(), et les
          # privilèges par défaut de Supabase — en exigeant que le trou se
          # reproduise sur une table sonde. La migration est appliquée deux
          # fois (elle doit se rejouer). Puis : anon, l'agent et un compte
          # quelconque refusés POUR LA BONNE RAISON, l'admin crée, modifie,
          # déplace, bloque, termine, archive ; le journal garde tout sauf le
          # contenu des champs libres ; aucune suppression, même à l'admin ; la
          # table des courses inchangée. Éprouvée contre quatorze migrations
          # faussées : elle tombe les quatorze fois.
          psql -h 127.0.0.1 -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 -c 'create database pilotage;'
          psql -h 127.0.0.1 -U postgres -d pilotage -X -q -v ON_ERROR_STOP=1 \
            -f supabase/tests/socle.sql \
            -f supabase/tests/role-agent-avant.sql \
            -f supabase/migrations/20260929030000_role_agent_serveur.sql \
            -f supabase/tests/pilotage.sql \
            -f supabase/migrations/20261006010000_pilotage.sql \
            -f supabase/migrations/20261006010000_pilotage.sql \
            -f supabase/tests/pilotage-apres.sql
          # RELU DANS UNE AUTRE SESSION : ce qui est relu a été gardé par la
          # base, pas seulement vu dans la transaction qui l'a écrit.
          psql -h 127.0.0.1 -U postgres -d pilotage -X -q -v ON_ERROR_STOP=1 \
            -f supabase/tests/pilotage-persistance.sql

      # LE PILOTAGE PAR LA PORTE DU NAVIGATEUR : PostgREST, le serveur que
      # Supabase place devant la base, avec de vrais jetons signés. La porte
      # publique fermée, pilotage.js qui parle la bonne langue, et son miroir
      # des règles qui rend le même verdict que la base sur tout un corpus.
      # PostgREST est téléchargé depuis sa page officielle, VERSION ET
      # EMPREINTE FIGÉES (celle du binaire éprouvé le 6 octobre 2026) : un
      # fichier qui changerait sous nos pieds arrête l'étape au lieu de
      # tourner. Il ne sert qu'ici : rien n'en part en ligne.
      - name: Le Pilotage en HTTP (PostgREST)
        shell: bash
        env: {PGHOST: 127.0.0.1, PGPORT: '5432', PGUSER: postgres, PGPASSWORD: postgres}
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/postgrest.tar.xz" \
            https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz
          echo "9f71269e61ac3a940281e93ff415760f5957e430e475ba4c3889f3ede7d5527c  $RUNNER_TEMP/postgrest.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/postgrest.tar.xz" -C "$RUNNER_TEMP"
          POSTGREST="$RUNNER_TEMP/postgrest" node supabase/tests/pilotage-http.mjs
