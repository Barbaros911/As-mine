# ═══════════════════════════════════════════════════════════════════════
# MONITORING DE PRODUCTION — une fusion n'est pas une preuve
# ───────────────────────────────────────────────────────────────────────
# `pages.yml` publie et s'arrête là. Personne ne va voir derrière. Tant
# que ce workflow n'existait pas, l'état « VÉRIFIÉ EN PRODUCTION » écrit
# dans AGENTS.md n'avait aucun porteur : on ne pouvait pas le prouver.
#
# TROIS DÉCLENCHEURS, TROIS PANNES DIFFÉRENTES :
#   - après une publication : la régression qu'on vient d'introduire ;
#   - toutes les 6 h : la panne d'hébergeur, qui n'attend pas nos fusions ;
#   - à la main : quand Barbaros doute.
#
# ON RÉESSAIE UNE FOIS AVANT DE CRIER. Un coup de réseau du coureur
# GitHub n'est pas une panne du site, et une fausse alerte à chaque
# passage est la meilleure façon de faire ignorer l'alerte suivante.
# Deux rapports complets en échec confirment un incident mesuré par la sonde.
#
# L'INCIDENT EST UNE ISSUE UNIQUE, PAS UNE PAR PASSAGE. Elle se met à
# jour tant que ça dure, et elle se FERME toute seule au retour à la
# normale — sinon on finirait avec quarante Issues pour une seule panne,
# et plus personne ne les lirait.
# ═══════════════════════════════════════════════════════════════════════
name: Monitoring production

on:
  workflow_run:
    workflows: ["Publier le site"]
    types: [completed]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      adresse:
        description: "Adresse à contrôler"
        required: false
        default: "https://elatransfer.com/"

permissions:
  contents: read
  issues: write

concurrency:
  group: ela-monitoring-production
  cancel-in-progress: false

jobs:
  controler:
    name: le site en ligne répond-il
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Après une publication : seulement si elle a réussi. Contrôler
    # derrière une publication ratée mesurerait la version d'avant.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7.0.1

      - name: Utiliser Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Installer les dépendances verrouillées
        run: npm ci --ignore-scripts

      - name: Installer Chromium Playwright
        run: npx playwright install --with-deps chromium

      - name: Contrôler le site en ligne
        id: controle
        shell: bash
        env:
          ADRESSE: ${{ github.event.inputs.adresse || 'https://elatransfer.com/' }}
        run: |
          # Une erreur avant le verdict laisse l'état absent : jamais une panne.
          attendu=""
          if [ "$ADRESSE" = "https://elatransfer.com/" ]; then
            git fetch --quiet --depth=1 origin main
            attendu=$(git rev-parse FETCH_HEAD)
          fi
          echo "Commit attendu : ${attendu:-(non exigé)}"
          node .github/scripts/monitoring-production.mjs "$ADRESSE" "$attendu"

      - name: Résumer le résultat du monitoring
        if: always()
        env:
          ETAT: ${{ steps.controle.outputs.etat }}
        shell: bash
        run: |
          etat="${ETAT:-technique}"
          {
            echo "## Monitoring production : $etat"
            if [ "$etat" = "technique" ]; then
              echo "Impossible de vérifier le site. Consulter l'étape en erreur (installation, runner ou contrôleur). Aucune panne du site n'est confirmée ; aucun incident de production ne sera ouvert ou fermé."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY" > "$RUNNER_TEMP/monitoring-resume.txt"

      - name: Conserver le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-production-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/rapport*.json
            ${{ runner.temp }}/sortie*.txt
            ${{ runner.temp }}/monitoring-resume.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Ouvrir ou clore l'incident
        if: always()
        uses: actions/github-script@v9
        env:
          ETAT: ${{ steps.controle.outputs.etat }}
          ADRESSE: ${{ github.event.inputs.adresse || 'https://elatransfer.com/' }}
        with:
          script: |
            await require('./.github/scripts/incident-production.cjs')({ github, context, core });
