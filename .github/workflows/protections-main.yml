# ═══════════════════════════════════════════════════════════════════════
# LES PROTECTIONS DE « main » EN LIGNE SONT-ELLES CELLES DU MIROIR ?
# ───────────────────────────────────────────────────────────────────────
# 20 octobre 2026, mission de finalisation. « .github/ruleset-main.json »
# est la CIBLE ; la règle « Protéger main » vit dans les réglages de GitHub,
# où ni l'agent ni le jeton des Actions ne peuvent écrire (pas de droit
# « administration »). Ce workflow LIT la règle en ligne, chaque jour et à
# chaque changement du miroir, et nomme chaque écart avec la case à cocher.
#
# UNE SEULE ISSUE, retrouvée par son marqueur, mise à jour tant que l'écart
# dure, FERMÉE seule quand la règle en ligne redevient le miroir. Une
# lecture impossible (API muette) ne crie pas : ce n'est pas un écart.
# ═══════════════════════════════════════════════════════════════════════
name: Protections de main

on:
  schedule:
    - cron: "41 5 * * *"
  push:
    branches: [main]
    paths:
      - ".github/ruleset-main.json"
      - ".github/scripts/verifier-protections.mjs"
      - ".github/workflows/protections-main.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  protections:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with: {node-version: '22'}
      - name: Comparer la règle en ligne au miroir
        id: controle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          node .github/scripts/verifier-protections.mjs "${{ github.repository }}" > "$RUNNER_TEMP/sortie.txt" 2>&1
          code=$?
          cat "$RUNNER_TEMP/sortie.txt"
          case "$code" in
            0) echo "etat=ok" >> "$GITHUB_OUTPUT" ;;
            1) echo "etat=ecart" >> "$GITHUB_OUTPUT" ;;
            *) echo "etat=lecture" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Ouvrir, mettre à jour ou clore l'écart
        uses: actions/github-script@v9
        env:
          ETAT: ${{ steps.controle.outputs.etat }}
        with:
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;
            const marqueur = "<!-- ela-protections-main -->";
            const etat = process.env.ETAT || "lecture";
            let sortie = "";
            try { sortie = fs.readFileSync(`${process.env.RUNNER_TEMP}/sortie.txt`, "utf8"); } catch { sortie = "(sortie indisponible)"; }
            const lien = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            if (etat === "lecture") { core.notice("Règle en ligne illisible : rien conclu. " + sortie.trim()); return; }
            const ouvertes = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: "open", per_page: 100 });
            const issue = ouvertes.find(i => !i.pull_request && i.body && i.body.includes(marqueur));
            if (etat === "ok") {
              if (issue) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
                  body: ["## Protections alignées", "", "La règle en ligne est celle de `.github/ruleset-main.json`.", "", `Passage : ${lien}`, "", "---", "_Generated by [Claude Code](https://claude.ai/code)_"].join("\n") });
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: "closed", state_reason: "completed" });
              }
              core.notice("Protections de main conformes au miroir.");
              return;
            }
            const corps = [
              marqueur,
              "## Les protections de `main` en ligne ne sont pas celles du miroir",
              "",
              "Ces réglages ne s'écrivent que depuis GitHub, avec un compte administrateur (l'enregistrement échoue sur iPhone : le faire depuis un ordinateur).",
              "Règle : Settings → Rules → Rulesets → « Protéger main ».",
              "",
              "```",
              sortie.trim(),
              "```",
              "",
              `Passage : ${lien}`,
              "",
              "Cette Issue se ferme d'elle-même au premier passage où la règle en ligne redevient le miroir.",
              "",
              "---",
              "_Generated by [Claude Code](https://claude.ai/code)_"
            ].join("\n");
            if (issue) await github.rest.issues.update({ owner, repo, issue_number: issue.number, body: corps });
            else await github.rest.issues.create({ owner, repo, title: "[PROTECTIONS] La règle de main en ligne diffère du miroir", body: corps, assignees: [owner] });
            core.setFailed("Écart entre la règle en ligne et .github/ruleset-main.json.");
