name: Contrôle notifications Admin
on:
  pull_request:
    paths:
      - 'admin-v2-push.js'
      - 'construire.sh'
      - 'supabase/functions/nouvelle-demande/**'
      - 'supabase/migrations/20260916090000_admin_push_notifications.sql'
      - '.github/workflows/admin-notifications-regression.yml'
permissions: {contents: read}
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Vérifier JavaScript navigateur
        run: node --check admin-v2-push.js
      - name: Construire
        run: bash construire.sh
        # Admin v2 n'est plus publié : ce contrôle le demande explicitement.
        env:
          ELA_AVEC_ADMIN_V2: "1"
      - name: Contrôler les invariants
        shell: bash
        run: |
          set -euo pipefail
          test -f site/admin-v2-push.js
          grep -Fq '/admin-v2-push.js' site/admin-v2.html
          grep -Fq 'ela_enregistrer_push_admin' admin-v2-push.js
          grep -Fq 'Notification.requestPermission' admin-v2-push.js
          # Les trois canaux partent ENSEMBLE ; depuis le 9/10/2026 la notification
          # reçoit l'étiquette « N° court » (etiquette(bon,ref)) en plus de la référence.
          grep -Fq 'Promise.all([parPush(t,ref,etiquette(bon,ref)),parTelegram(t,m,ref),parEmail(t,m)])' supabase/functions/nouvelle-demande/index.ts
          grep -Fq 'journal_notifications_admin' supabase/functions/nouvelle-demande/index.ts
          grep -Fq 'abonnements_admin' supabase/functions/nouvelle-demande/index.ts
          grep -Fq 'security definer' supabase/migrations/20260916090000_admin_push_notifications.sql
          grep -Fq 'est_exploitant()' supabase/migrations/20260916090000_admin_push_notifications.sql
          if grep -REq 'sk_(test|live)_[A-Za-z0-9]' admin-v2-push.js supabase/functions/nouvelle-demande; then
            echo 'Secret Stripe interdit détecté'
            exit 1
          fi
