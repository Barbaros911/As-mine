name: Publier le site

# Publie le site à chaque modification de la branche principale.
# « enablement: true » active GitHub Pages automatiquement au premier passage :
# aucun réglage manuel n'est nécessaire dans les paramètres du dépôt.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; on ne coupe pas une publication en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Configurer et activer GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Une seule recette, partagée avec Cloudflare Pages. Tant que les deux
      # hébergeurs assemblaient le site chacun de leur côté, il n'était
      # qu'une question de temps avant que l'un publie un fichier que
      # l'autre avait oublié.
      # UNE DOCUMENTATION QUI MENT NE PASSE PLUS. Le 16 septembre 2026,
      # CLAUDE.md annonçait un tarif au kilomètre que le code n'appliquait
      # plus depuis la PR #123. Le prix d'Elatransfer est ferme donc
      # opposable : c'est ce chiffre-là qu'on annonce au téléphone et qu'on
      # recopie dans les CGV. Tout ce qui s'écrit à la main finit périmé —
      # la seule parade est que la construction s'arrête.
      # Ni navigateur ni réseau : une seconde.
      - name: Contrôler que la documentation dit vrai
        run: node test-doc.mjs

      - name: Construire et contrôler le site unifié
        run: node test-unified-facade.mjs

      - name: Téléverser le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Mettre en ligne
        id: deploiement
        uses: actions/deploy-pages@v4
