name: Publier le site

# Publie le site à chaque modification de la branche principale.
# « enablement: true » active GitHub Pages automatiquement au premier passage :
# aucun réglage manuel n'est nécessaire dans les paramètres du dépôt.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; on ne coupe pas une publication en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer et activer GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Préparer les fichiers du site
        run: |
          mkdir -p site
          cp index.html admin.html styles.css manifest.webmanifest sw.js icon.svg icon-maskable.svg icon-180.png robots.txt sitemap.xml site/
          # Le domaine personnalisé. Sans ce fichier dans la publication,
          # GitHub Pages l'oublie à chaque déploiement.
          cp CNAME site/
          cp -r photos site/photos
          # Empêche Jekyll de réinterpréter les fichiers
          touch site/.nojekyll

      - name: Ajouter les autres sites
        run: |
          # Chaque dossier de « sites/ » devient un site indépendant, publié à
          # l'adresse .../As-mine/<nom>/. La racine — As-mine — est copiée
          # avant, et rien ici ne peut l'écraser : un dossier portant le nom
          # d'un de ses fichiers fait échouer la publication.
          [ -d sites ] || exit 0
          reserves="index.html admin.html styles.css photos CNAME manifest.webmanifest sw.js icon.svg icon-maskable.svg icon-180.png robots.txt sitemap.xml demos"
          for dossier in sites/*/; do
            [ -d "$dossier" ] || continue
            nom=$(basename "$dossier")
            # Un dossier préfixé « _ » est un modèle interne : ni publié, ni listé.
            case "$nom" in _*) echo "Ignoré : $nom (modèle interne)"; continue;; esac
            for reserve in $reserves; do
              if [ "$nom" = "$reserve" ]; then
                echo "::error::Le dossier sites/$nom porte le nom d'un fichier d'As-mine. Renommez-le : il écraserait le site principal."
                exit 1
              fi
            done
            echo "Publication du site « $nom » sur /$nom/"
            cp -r "$dossier" "site/$nom"
          done

      - name: Construire la galerie des démonstrations
        run: node .github/scripts/galerie.mjs

      - name: Téléverser le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Mettre en ligne
        id: deploiement
        uses: actions/deploy-pages@v4
