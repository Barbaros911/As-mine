name: Publier le site

# Publie le site à chaque modification de la branche principale.
# « enablement: true » active GitHub Pages automatiquement au premier passage :
# aucun réglage manuel n'est nécessaire dans les paramètres du dépôt.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; on ne coupe pas une publication en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer et activer GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Une seule recette, partagée avec Cloudflare Pages. Tant que les deux
      # hébergeurs assemblaient le site chacun de leur côté, il n'était
      # qu'une question de temps avant que l'un publie un fichier que
      # l'autre avait oublié.
      - name: Construire le site
        run: sh construire.sh

      - name: Téléverser le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Mettre en ligne
        id: deploiement
        uses: actions/deploy-pages@v4
