name: Contrôle source tarifaire serveur
on:
  pull_request:
    paths:
      - 'index.html'
      # UN MOTIF, PLUS DEUX NOMS (4 octobre 2026). La liste nommait les deux
      # migrations de tarif du jour où elle a été écrite : une troisième,
      # poussée seule, n'aurait déclenché aucun contrôle.
      - 'supabase/migrations/**'
      - '.github/scripts/verifier-tarif-hotel.mjs'
      - '.github/workflows/tariff-source-regression.yml'
      - 'sites/easyhotel-client/**'
permissions: {contents: read}
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash construire.sh
      - shell: bash
        run: |
          set -euo pipefail
          # LE TARIF GÉNÉRAL (GAMMES) N'EST PLUS FIGÉ ICI PAR DES VALEURS EN
          # DUR : depuis l'unification du 28/09/2026, il est comparé à la
          # source serveur REJOUÉE (toutes les migrations, dans l'ordre) par
          # « verifier-tarif-hotel.mjs » plus bas, qui nomme l'écart en euros
          # plutôt que de faire tomber un grep muet sur un ancien chiffre.
          # easyHotel après transformation de production : aucun tarif nuit/WE.
          # LA FORME A CHANGÉ LE 22/09/2026, ET CE GREP L'AVAIT FIGÉE. Il cherchait
          # « jour:{…}, nuit:{…} » — deux copies du même prix, que le retrait du tarif
          # de nuit a fondues en UN seul « forfait ». Le contrôle tombait alors sur un
          # code juste : exactement la faute que ce dépôt reproche ailleurs, une forme
          # écrite en dur qui survit au changement qui l'invalide.
          grep -Fq 'forfait:{ berline:35,  van:50  }' site/index.html
          # ET LA RÈGLE ELLE-MÊME, qui ne vieillira pas : plus aucun tarif de nuit
          # dans le site publié. Le grep du dessus dit le bon montant, celui-ci dit
          # qu'aucune seconde grille ne peut revenir en silence.
          if grep -Eq 'nuitHotel|noteNuit|hotel_nuit|nuit_hotel' site/index.html; then
            echo 'Un tarif de nuit est réapparu dans le site publié.'; exit 1
          fi
          grep -Fq "('cdg','Aéroport CDG','berline',3500)" supabase/migrations/20260916100000_current_tariff_source.sql
          grep -Fq "('cdg','Aéroport CDG','van',5000)" supabase/migrations/20260916100000_current_tariff_source.sql
          grep -Fq "('beauvais','Beauvais','berline',18000)" supabase/migrations/20260916100000_current_tariff_source.sql
          # Les autres forfaits ne sont plus figés ici : verifier-tarif-hotel.mjs
          # exige l'accord serveur / moteur / page du QR pour les quatorze.
          # LE TARIF HÔTEL AU KILOMÈTRE — le trou que ces greps laissaient.
          # Ils comparent les tarifs généraux et les forfaits, mais pas le
          # taux appliqué à « autre destination » depuis une réception. Il
          # n'existe que dans le site CONSTRUIT : aucune suite qui éprouve
          # le dépôt ne peut le voir. Mesuré : avec 9,99 €/km posé dans le
          # transformateur, le site publié facturait 9,99 et tout restait
          # vert. Ce contrôle NE FIGE AUCUN NOMBRE — il lit les deux côtés
          # et exige qu'ils soient égaux.
          node .github/scripts/verifier-tarif-hotel.mjs site/index.html
