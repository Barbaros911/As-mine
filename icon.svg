<!-- LOGO ELATRANSFER : le signe court.
     « ELA » gravé en ivoire sur marine, souligné d'un filet doré qui ne
     s'arrête pas au bord du carré : la route continue hors du cadre.
     C'est la seule idée du logo, et elle survit à 24 px.
     Il sert partout où il n'y a pas la place d'écrire le nom en entier :
     l'onglet du navigateur, l'écran d'accueil du téléphone, la photo de
     profil WhatsApp. Le nom complet s'écrit à côté (bloc de marque dans
     l'en-tête d'index.html).
     Pourquoi trois lettres et pas un dessin de voiture : en tout petit une
     voiture devient une tache grise, et tous les concurrents en mettent
     donc aucun ne s'en distingue. Ici la marque se reconnaît à ses deux
     couleurs, marine et or.
     Les lettres sont les contours réels d'Inter, converties en formes :
     le fichier ne dépend d'aucune police et s'affiche à l'identique
     partout, même sans réseau. Fabriqué par poser.py, ne pas retoucher
     à la main.
     Attention : un commentaire XML ne supporte pas deux tirets à la
     suite. Ne pas mettre de ligne de séparation en tirets ici, le fichier
     deviendrait illisible et l'icône disparaîtrait partout. -->
