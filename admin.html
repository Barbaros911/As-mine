<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="refresh" content="0;url=./application.html?exploitant=1">
  <link rel="manifest" href="./manifest-exploitant.webmanifest">
  <title>ELA Transfer — Espace exploitant</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f9fc;color:#062f55;font-family:Inter,Arial,sans-serif}
    main{width:min(420px,100%);padding:32px;text-align:center;background:#fff;border:1px solid #dfe8ee;border-radius:18px;box-shadow:0 14px 36px rgba(7,43,70,.12)}
    img{width:150px;height:auto}p{margin:22px 0 16px;line-height:1.5}a{display:inline-block;padding:13px 20px;border-radius:10px;background:#062f55;color:#fff;text-decoration:none;font-weight:800}
  </style>
</head>
<body>
  <main>
    <img src="./brand-logo.webp" alt="ELA Transfer">
    <p>Ouverture de l’espace exploitant ELA Transfer…</p>
    <a id="secours" href="./application.html?exploitant=1">Continuer</a>
  </main>
  <script>
    (function(){
      var params = new URLSearchParams(location.search);
      params.set("exploitant", "1");
      var cible = "./application.html?" + params.toString() + location.hash;
      document.getElementById("secours").href = cible;
      location.replace(cible);
    }());
  </script>
</body>
</html>
