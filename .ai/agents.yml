version: 1
orchestrateur:
  outil: chatgpt-codex
  mission: attribution, suivi GitHub, intégration et compte rendu

execution:
  - role: ARCHITECTE
    moteur: claude-code
    risque_max: P1
  - role: FRONTEND
    moteur: local-aider
    risque_max: P2
  - role: ADMIN
    moteur: claude-code
    risque_max: P1
  - role: BOOKING
    moteur: claude-code
    risque_max: P1
  - role: HOTEL
    moteur: local-aider
    risque_max: P2
  - role: DRIVER
    moteur: claude-code
    risque_max: P1
  - role: QA
    moteur: local-aider
    risque_max: P2
  - role: SECURITY
    moteur: chatgpt-codex
    risque_max: P0
  - role: SEO
    moteur: local-aider
    risque_max: P2
  - role: DEVOPS
    moteur: chatgpt-codex
    risque_max: P0
  - role: REVIEWER
    moteur: chatgpt-ou-claude
    risque_max: P0

regles:
  code_valide_source_de_verite: main
  coordination_source_de_verite: github-issues-et-pr
  # Plus de branche d'intégration : ai-dev est gelée depuis le 2026-10-05
  # (TEAM_RULES.md §2). Chaque tâche part du dernier main et y revient par PR.
  branche_integration: aucune
  branche_production: main
  branche_agent_depuis: main
  pr_agent_vers: main
  fusion_automatique: false
  validation_humaine_main: obligatoire
  production_automatique: false
  humain_obligatoire: Burak
  opencode_local: experimental-sans-validation-finale
  zones_locales_interdites:
    - paiements
    - secrets
    - migrations-destructives
    - production
    - permissions-administrateur
